# Example 04, step 3: the same years with 30% of the discharge abstracted.
# The input file is made by run.py (the measured file with Discharge x 0.7).
#   pyair2stream --config examples/04_scenario/abstraction.yaml
project_name: "scenario"
station_name: "Mentue"
series: "c"
time_resolution: "1d"
version: 8
integrator: "CRN"
run_mode: "FORWARD"

paths:
  input_data: "examples/04_scenario/output/abstraction_input.csv"
  output_dir: "examples/04_scenario/output/abstraction"
  # Keeps the calibration's Qmedia, so the reduced flow is seen as reduced:
  calibration_metadata: "examples/04_scenario/output/calibration/calibration_metadata.json"

uncertainty_options:
  noise_model: "ar1"
  save_ensemble: true

forward_options:
  enable_prediction_intervals: true
  mcmc_chain_path: "examples/04_scenario/output/calibration/MCMC_chain_Mentue_c_1d.csv"
  # Use exactly the same 1000 parameter sets as the baseline run:
  reuse_sample_indices_from: "examples/04_scenario/output/baseline/Forward_Prediction_Ensemble_Mentue_c_1d_meta.json"
