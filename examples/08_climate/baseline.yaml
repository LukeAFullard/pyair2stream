# Example 08, step 2: 1,000 simulations of 2010-2012 with the measured air temperature
# and discharge. Run after step 1, from the repository's top folder:
#   pyair2stream --config examples/08_climate/baseline.yaml
project_name: "climate"
station_name: "Mentue"
series: "c"
time_resolution: "1d"
version: 8
integrator: "CRN"
run_mode: "FORWARD"

paths:
  input_data: "data/switzerland/MAH_2369_validation.csv"        # 2010-2012
  output_dir: "examples/08_climate/output/baseline"
  calibration_metadata: "examples/08_climate/output/calibration/calibration_metadata.json"

uncertainty_options:
  noise_model: "ar1"
  save_ensemble: true      # keep every simulation, to compute yearly peaks and paired changes

forward_options:
  enable_prediction_intervals: true
  mcmc_chain_path: "examples/08_climate/output/calibration/MCMC_chain_Mentue_c_1d.csv"
  n_samples: 1000
  random_seed: 42
