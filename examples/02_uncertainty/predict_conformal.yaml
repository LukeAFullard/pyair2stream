# Example 02, step 4: predict 2010-2012 again, with the 90% interval widened by
# the conformal margin of step 3.
# Run after steps 1 and 3, from the repository's top folder:
#   pyair2stream --config examples/02_uncertainty/predict_conformal.yaml
project_name: "uncertainty"
station_name: "Mentue"
series: "c"
time_resolution: "1d"
version: 8
integrator: "CRN"
run_mode: "FORWARD"

paths:
  input_data: "data/switzerland/MAH_2369_validation.csv"        # 2010-2012
  output_dir: "examples/02_uncertainty/output/prediction_conformal"
  calibration_metadata: "examples/02_uncertainty/output/calibration/calibration_metadata.json"

uncertainty_options:
  noise_model: "ar1"       # the same as in steps 1 and 3
  prediction_interval: 90  # the margin used is the one for this level
  save_ensemble: true      # keep every series, for 7-day and 30-day means

forward_options:
  enable_prediction_intervals: true
  mcmc_chain_path: "examples/02_uncertainty/output/calibration/MCMC_chain_Mentue_c_1d.csv"
  n_samples: 1000
  random_seed: 42          # the same parameter sets as step 2
  conformal_margins: "examples/02_uncertainty/output/check/cv_conformal_margins.csv"
