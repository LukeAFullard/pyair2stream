# Example 02, step 3: check the interval on years the model was not calibrated
# on (leave-one-year-out cross-validation of 2002-2009), and measure the
# conformal margins that would widen it to the held-out years' coverage.
# Run from the repository's top folder:
#   pyair2stream --config examples/02_uncertainty/check.yaml
project_name: "uncertainty"
station_name: "Mentue"
series: "c"
time_resolution: "1d"
version: 8
integrator: "CRN"
objective_function: "NSE"
run_mode: "DE"
random_seed: 42
Qmedia: 1.4915             # as the calibration (step 1): the mean discharge of 2002-2009

paths:
  input_data: "data/switzerland/MAH_2369_calibration.csv"       # 2002-2009
  output_dir: "examples/02_uncertainty/output/check"

parameter_bounds:
  min: [-5, -5, -5, -1, 0,  0,  0, -1]
  max: [15, 1.5, 5,  1, 20, 10, 1,  5]

uncertainty_options:       # the same error model and level as step 1
  noise_model: "ar1"
  prediction_interval: 90

cross_validation:
  enabled: true            # writes cv_interval_coverage.csv and cv_conformal_margins.csv
