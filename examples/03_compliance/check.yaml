# Example 03, step 3: check the yearly statistics on years the model was not
# calibrated on (leave-one-year-out cross-validation of 2002-2009).
# Run from the repository's top folder:
#   pyair2stream --config examples/03_compliance/check.yaml
project_name: "compliance"
station_name: "Mentue"
series: "c"
time_resolution: "1d"
version: 8
integrator: "CRN"
objective_function: "NSE"
run_mode: "DE"
random_seed: 42
Qmedia: 1.4915             # as the calibration (step 1): the mean discharge of 2002-2009

paths:
  input_data: "data/switzerland/MAH_2369_calibration.csv"       # 2002-2009
  output_dir: "examples/03_compliance/output/check"

parameter_bounds:
  min: [-5, -5, -5, -1, 0,  0,  0, -1]
  max: [15, 1.5, 5,  1, 20, 10, 1,  5]

cross_validation:
  enabled: true
  min_train_years: 0       # hold out every year but the first (2002)
  threshold: 18            # degC, the same threshold as the question ("days above 18 degC")
  season_months: [6, 7, 8, 9]   # a year counts if at least 80% of June-September was measured
