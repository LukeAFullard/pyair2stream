# Example 07: run the model on the daily files prepared by run.py from raw logger files.
# From the repository's top folder, after run.py has made the files:
#   pyair2stream --config examples/07_preparing_data/config.yaml
project_name: "preparing_data"
station_name: "Mentue"
series: "c"
time_resolution: "1d"
version: 8
integrator: "CRN"
objective_function: "NSE"
run_mode: "DE"
random_seed: 42

paths:
  input_data: "examples/07_preparing_data/output/calibration.csv"       # 2002-2009
  validation_data: "examples/07_preparing_data/output/validation.csv"   # 2010-2012
  output_dir: "examples/07_preparing_data/output/model"

parameter_bounds:
  min: [-5, -5, -5, -1, 0,  0,  0, -1]
  max: [15, 1.5, 5,  1, 20, 10, 1,  5]
