# Example 06, last step: which parameters change the simulated temperature most?
# A single calibration of version 8 on 2002-2009, then a local sensitivity analysis.
# From the repository's top folder:
#   pyair2stream --config examples/06_cross_validation/sensitivity.yaml
project_name: "cross_validation"
station_name: "Mentue"
series: "c"
time_resolution: "1d"
version: 8
integrator: "CRN"
objective_function: "NSE"
run_mode: "DE"
random_seed: 42

paths:
  input_data: "data/switzerland/MAH_2369_calibration.csv"       # 2002-2009
  output_dir: "examples/06_cross_validation/output/sensitivity"

parameter_bounds:
  min: [-5, -5, -5, -1, 0,  0,  0, -1]
  max: [15, 1.5, 5,  1, 20, 10, 1,  5]

sensitivity_analysis: true
sensitivity_perturbations: [1.0]          # move each parameter up and down by 1% ...
sensitivity_perturbation_mode: "range"    # ... of its bound range, so parameters can be compared
