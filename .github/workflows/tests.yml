name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Install package + test dependencies
        run: pip install -e . pytest

      - name: Run test suite (including Fortran golden tests)
        run: pytest tests/ -v

  # `pip install -e .` above resolves against pyproject.toml's loose lower-bound-only
  # dependency floors and can silently pick a different dependency set than the one
  # `poetry.lock` pins and the one the bundled example outputs were generated with
  # (docs/audit/00_INDEX.md's audited environment; docs/audit/07_reproducibility_and_
  # provenance.md, 7.7). This job installs the exact locked versions instead, so a
  # regression caused by a newer transitive dependency doesn't hide behind the
  # floating-dependency matrix job above.
  test-locked-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Install poetry
        run: pip install poetry

      - name: Install exact locked dependencies from poetry.lock
        run: poetry install --with dev --sync

      - name: Run test suite (including Fortran golden tests) against the locked environment
        run: poetry run pytest tests/ -v

  # `model_numba.py`'s integrator/objective kernels are @njit-decorated. Under
  # coverage.py's normal trace hook, Numba-JIT-compiled code runs as compiled
  # machine code and is invisible to it -- reported as ~6% covered even though
  # every line is actually exercised by the golden tests, making the overall
  # coverage number meaningless (docs/audit/08_testing_gaps.md, 8.4). Setting
  # NUMBA_DISABLE_JIT=1 makes Numba run its decorated functions as plain
  # Python, which coverage.py traces normally. This job reports coverage from
  # that run; the JIT-enabled jobs above stay as the correctness/speed check
  # (a numba dispatcher and its plain-Python fallback are not guaranteed to
  # hit identical code paths, so this alone would not substitute for them).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Install package + test dependencies
        run: pip install -e . pytest pytest-cov

      - name: Run test suite with coverage (Numba JIT disabled)
        env:
          NUMBA_DISABLE_JIT: "1"
        run: pytest tests/ --cov=pyair2stream --cov-report=term-missing --cov-report=xml

  # `tests/test_examples_smoke.py` only parses the example scripts; nothing
  # actually executed them, so a real regression (e.g. a renamed output
  # column two scripts still referenced -- docs/audit/05_cli_and_io_
  # correctness.md, Defect E) was only ever caught by a user. This job
  # actually runs the two examples that are self-contained -- their input
  # data is either checked into the repo (`quickstart`) or generated by the
  # example itself (`forward_prediction_intervals`) -- against a small/fast
  # config (docs/audit/08_testing_gaps.md, 8.6).
  #
  # The rest (Hopelands, cross_validation, gap_experiment, mcmc_comparison,
  # optimizer_comparison, optimizer_convergence, validation/Switzerland) all
  # read real station data or the Piccolroaz et al. (2016) supplementary
  # dataset that is intentionally not vendored in this repository (see
  # .gitignore's per-example CSV rules) -- there is no small/fast config that
  # makes them runnable here without that data.
  examples-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Run quickstart example
        run: python -m pyair2stream.main --config examples/quickstart/config.yaml

      - name: Run forward_prediction_intervals example (--smoke)
        run: |
          python examples/forward_prediction_intervals/generate_data.py
          python examples/forward_prediction_intervals/run_example.py --smoke
